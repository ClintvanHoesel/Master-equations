[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "master-equations"
version = "1.0.0"
description = "Pair-correlation master equations for triplet excitons and polarons"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
authors = [{name = "Clint van Hoesel"}]
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
excel = ["openpyxl>=3.1"]
notebook = ["ipykernel>=6.29"]
dev = ["pytest>=8", "ruff>=0.9", "nbclient>=0.10", "nbformat>=5.10"]

[project.scripts]
master-equations = "master_equations.cli:main"

[tool.setuptools.packages.find]
include = ["master_equations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
